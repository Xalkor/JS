<html>
<h1>Leek Litch Spin</h1>
<title>Leek Litch Spin</title>
<div class="leek-wrapper">
    <img id="leek" src="leek.gif">
    <img id="leeklitch" src="leeklitch.png" style="height:50vh;">
</div>

<style>
.leek-wrapper {
    position: relative;
    display: inline-block;
}

#leek {
    width: auto;
    height: 80vh;
    aspect-ratio: 4/3;
}

#leeklitch {
    position: absolute;
    aspect-ratio: 2/3;
    height: 40vh;
    top: 40%;
    left: 5%;
    transform: translate(-50%, -50%);
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(-360deg);
  }
}
</style>

<html>
